<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>homeproxy-go</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f1419;color:#e7ecf3}
header{padding:1rem 1.25rem;border-bottom:1px solid #2d3a4f;display:flex;justify-content:space-between;align-items:center}
.badge{padding:.25rem .6rem;border-radius:999px;font-size:.8rem;background:#450a0a;color:#fca5a5}
.badge.on{background:#14532d;color:#86efac}
main{max-width:900px;margin:0 auto;padding:1rem}
.card{background:#1a2332;border:1px solid #2d3a4f;border-radius:12px;padding:1rem;margin-bottom:1rem}
label{display:block;color:#8b9bb4;font-size:.85rem;margin:.4rem 0 .2rem}
input,select,textarea{width:100%;padding:.5rem;border-radius:8px;border:1px solid #2d3a4f;background:#0d1219;color:#e7ecf3;margin-bottom:.5rem;box-sizing:border-box}
textarea{min-height:120px;font-family:monospace}
button{border:0;border-radius:8px;padding:.5rem 1rem;background:#3b82f6;color:#fff;cursor:pointer;margin:.2rem}
button.sec{background:#334155}button.ok{background:#22c55e;color:#052e16}button.er{background:#ef4444}
.msg{color:#8b9bb4;font-size:.85rem}.msg.e{color:#fca5a5}.msg.o{color:#86efac}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #2d3a4f;padding:.4rem;text-align:left}
.tabs button{background:transparent;border:1px solid #2d3a4f;color:#8b9bb4}.tabs button.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.panel{display:none}.panel.active{display:block}
</style>
</head>
<body>
<header><h1 style="margin:0;font-size:1.1rem">homeproxy-go</h1><span id="badge" class="badge">● 已停止</span></header>
<main>
<div class="tabs">
<button type="button" class="active" data-t="ov">概览</button>
<button type="button" data-t="cf">配置</button>
<button type="button" data-t="nd">节点</button>
<button type="button" data-t="tl">工具</button>
</div>
<div id="ov" class="panel active">
<div class="card"><h3>服务状态</h3><p id="rs" style="font-size:1.3rem;font-weight:600">—</p>
<button type="button" class="ok" id="bStart">启用</button>
<button type="button" class="er" id="bStop">停用</button>
<button type="button" class="sec" id="bRestart">重启</button>
<button type="button" class="sec" id="bRef">刷新</button>
<div class="msg" id="om"></div></div>
<div class="card"><p>路由 <b id="sm">—</b> · 代理 <b id="sp">—</b> · 节点 <b id="sn">—</b></p><p id="spath" style="color:#8b9bb4;font-size:.8rem"></p></div>
</div>
<div id="cf" class="panel">
<div class="card">
<label>路由模式</label>
<select id="mode"><option value="bypass_mainland_china">绕过中国大陆</option><option value="gfwlist">GFWList</option><option value="proxy_mainland_china">仅代理大陆</option><option value="global">全局</option><option value="custom">自定义</option></select>
<label>透明代理</label>
<select id="pmode"><option value="tproxy">TProxy</option><option value="redirect">Redirect</option><option value="tun">TUN</option></select>
<label>主节点</label><input id="mnode"/>
<label>LAN 网卡</label><input id="lif" placeholder="eth1"/>
<label>远程 DNS</label><input id="dns"/><label>国内 DNS</label><input id="cdns"/>
<label>日志</label><select id="log"><option>warn</option><option>info</option><option>debug</option></select>
<button type="button" id="bSave">保存</button><button type="button" class="sec" id="bLoad">重载</button>
<div class="msg" id="cm"></div></div></div>
<div id="nd" class="panel">
<div class="card"><table><thead><tr><th>名称</th><th>类型</th><th>服务器</th><th>端口</th></tr></thead><tbody id="nt"></tbody></table>
<label>名称</label><input id="nn"/><label>类型</label>
<select id="ntype"><option>shadowsocks</option><option>vmess</option><option>vless</option><option>trojan</option><option>hysteria2</option></select>
<label>服务器</label><input id="ns"/><label>端口</label><input id="np" type="number"/>
<label>密码/UUID</label><input id="nsec"/><label>SS 加密</label><input id="nm" placeholder="aes-128-gcm"/>
<label>TLS SNI</label><input id="nsni"/>
<button type="button" id="bAdd">添加并保存</button><div class="msg" id="nmmsg"></div></div></div>
<div id="tl" class="panel">
<div class="card">
<button type="button" class="sec" id="bGen">生成配置</button>
<button type="button" class="sec" id="bNft">应用 nft</button>
<button type="button" class="sec" id="bRes">更新资源列表</button>
<div class="msg" id="tm"></div>
<label>YAML</label><textarea id="yaml"></textarea>
<button type="button" id="bSY">保存 YAML</button><button type="button" class="sec" id="bLY">加载</button>
<div class="msg" id="ym"></div></div></div>
</main>
<script>
let cfg=null;const $=id=>document.getElementById(id);
const msg=(el,t,ok)=>{el.textContent=t||'';el.className='msg'+(t?(ok?' o':' e'):'')};
async function api(p,o={}){const r=await fetch('/api'+p,{headers:{'Content-Type':'application/json'},...o});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.statusText);return d}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.t).classList.add('active')});
async function refresh(){try{const s=await api('/status');const b=$('badge');if(s.running){b.textContent='● 运行中 PID '+s.pid;b.className='badge on';$('rs').textContent='运行中'}else{b.textContent='● 已停止';b.className='badge';$('rs').textContent='已停止'}$('sm').textContent=s.mode||'—';$('sp').textContent=s.proxy_mode||'—';$('sn').textContent=s.main_node||'—';$('spath').textContent=s.config_path||''}catch(e){msg($('om'),e.message,0)}}
function fill(c){cfg=c;$('mode').value=c.mode||'bypass_mainland_china';$('pmode').value=(c.proxy&&c.proxy.mode)||'tproxy';$('mnode').value=(c.proxy&&c.proxy.main_node)||'';$('lif').value=((c.control&&c.control.lan_interfaces)||[]).join(',');$('dns').value=(c.dns&&c.dns.server)||'';$('cdns').value=(c.dns&&c.dns.china_server)||'';$('log').value=(c.log&&c.log.level)||'warn';const tb=$('nt');tb.innerHTML='';(c.nodes||[]).forEach(n=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${n.name||''}</td><td>${n.type||''}</td><td>${n.server||''}</td><td>${n.port||''}</td>`;tb.appendChild(tr)})}
function formCfg(){const c=JSON.parse(JSON.stringify(cfg||{}));c.mode=$('mode').value;c.proxy=c.proxy||{};c.proxy.mode=$('pmode').value;c.proxy.main_node=$('mnode').value.trim();c.control=c.control||{};c.control.lan_interfaces=$('lif').value.split(',').map(s=>s.trim()).filter(Boolean);c.dns=c.dns||{};c.dns.server=$('dns').value.trim();c.dns.china_server=$('cdns').value.trim();c.log=c.log||{};c.log.level=$('log').value;return c}
async function loadCfg(){const d=await api('/config');fill(d.config);if(d.yaml)$('yaml').value=d.yaml}
$('bRef').onclick=refresh;
$('bStart').onclick=async()=>{try{msg($('om'),'启动中…',1);await api('/start',{method:'POST'});msg($('om'),'已启用',1);await refresh()}catch(e){msg($('om'),e.message,0)}};
$('bStop').onclick=async()=>{try{await api('/stop',{method:'POST',body:JSON.stringify({flush_nft:true})});msg($('om'),'已停用',1);await refresh()}catch(e){msg($('om'),e.message,0)}};
$('bRestart').onclick=async()=>{try{await api('/restart',{method:'POST'});msg($('om'),'已重启',1);await refresh()}catch(e){msg($('om'),e.message,0)}};
$('bSave').onclick=async()=>{try{await api('/config',{method:'PUT',body:JSON.stringify(formCfg())});msg($('cm'),'已保存',1);await loadCfg()}catch(e){msg($('cm'),e.message,0)}};
$('bLoad').onclick=async()=>{try{await loadCfg();msg($('cm'),'已加载',1)}catch(e){msg($('cm'),e.message,0)}};
$('bAdd').onclick=async()=>{try{const c=formCfg();c.nodes=c.nodes||[];const t=$('ntype').value;const n={name:$('nn').value.trim(),type:t,server:$('ns').value.trim(),port:+$('np').value||0};if(!n.name||!n.server)throw new Error('必填');const s=$('nsec').value.trim();if(t==='shadowsocks'){n.password=s;n.method=$('nm').value.trim()||'aes-128-gcm'}else if(t==='vmess'||t==='vless')n.uuid=s;else n.password=s;const sni=$('nsni').value.trim();if(sni)n.tls={enabled:true,server_name:sni};c.nodes.push(n);if(!c.proxy.main_node)c.proxy.main_node=n.name;await api('/config',{method:'PUT',body:JSON.stringify(c)});msg($('nmmsg'),'已添加',1);await loadCfg()}catch(e){msg($('nmmsg'),e.message,0)}};
$('bGen').onclick=async()=>{try{await api('/generate',{method:'POST'});msg($('tm'),'已生成',1)}catch(e){msg($('tm'),e.message,0)}};
$('bNft').onclick=async()=>{try{await api('/apply-nft',{method:'POST'});msg($('tm'),'nft 已应用',1)}catch(e){msg($('tm'),e.message,0)}};
$('bRes').onclick=async()=>{try{await api('/update-resources',{method:'POST'});msg($('tm'),'已更新',1)}catch(e){msg($('tm'),e.message,0)}};
$('bLY').onclick=async()=>{try{const d=await api('/config');$('yaml').value=d.yaml||'';msg($('ym'),'已加载',1)}catch(e){msg($('ym'),e.message,0)}};
$('bSY').onclick=async()=>{try{await api('/config/yaml',{method:'PUT',body:JSON.stringify({yaml:$('yaml').value})});msg($('ym'),'已保存',1);await loadCfg()}catch(e){msg($('ym'),e.message,0)}};
(async()=>{await refresh();try{await loadCfg()}catch(e){msg($('cm'),e.message,0)}setInterval(refresh,5000)})();
</script>
</body>
</html>
